name: Build Mobile Apps

on:
  workflow_dispatch:

jobs:
  android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flet

      - name: Sanitize local data files
        run: python scripts/prepare_release_payload.py

      - name: Build APK
        run: >
          flet build apk
          --clear-cache
          --module-name main
          --exclude .venv .program build dist __pycache__ logs .git .github .vscode Парсер media/user_backgrounds CatManPro.spec pyarmor.bug.log quick_accounts.json super_admin_account.json config.txt

      - name: Collect APK in .program/<version>/.apk
        run: |
          RELEASE_DIR=".program/${GITHUB_REF_NAME}"
          mkdir -p "$RELEASE_DIR/.apk"
          APK_PATH=$(find . -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "APK not found" >&2
            exit 1
          fi
          cp "$APK_PATH" "$RELEASE_DIR/.apk/CatManPro-android.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CatManPro-android-apk
          path: .program/${{ github.ref_name }}/.apk/CatManPro-android.apk
