name: Build and Publish CatMan Pro

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) {
            pip install -r requirements.txt
          }
          pip install pyinstaller

      - name: Sanitize local data files
        shell: pwsh
        run: |
          python scripts/prepare_release_payload.py

      - name: Build EXE
        shell: pwsh
        run: |
          $releaseDir = ".program/${{ github.ref_name }}"
          pyinstaller --noconfirm --clean --onefile --windowed --name CatManPro main.py
          New-Item -ItemType Directory -Force -Path "$releaseDir/.portable" | Out-Null
          Copy-Item dist/CatManPro.exe "$releaseDir/.portable/CatManPro-portable.exe" -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: catman-windows
          path: .program/${{ github.ref_name }}/.portable/CatManPro-portable.exe

  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flet

      - name: Sanitize local data files
        run: python scripts/prepare_release_payload.py

      - name: Build APK
        run: |
          flet build apk \
            --clear-cache \
            --module-name main \
            --exclude \
              .venv \
              .program \
              build \
              dist \
              __pycache__ \
              logs \
              .git \
              .github \
              .vscode \
              "Парсер" \
              "media/user_backgrounds" \
              "CatManPro.spec" \
              "pyarmor.bug.log" \
              "quick_accounts.json" \
              "super_admin_account.json" \
              "config.txt"

      - name: Collect APK
        run: |
          RELEASE_DIR=".program/${GITHUB_REF_NAME}"
          mkdir -p "$RELEASE_DIR/.apk"
          APK_PATH=$(find . -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "APK not found" >&2
            exit 1
          fi
          cp "$APK_PATH" "$RELEASE_DIR/.apk/CatManPro-android.apk"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: catman-android
          path: .program/${{ github.ref_name }}/.apk/CatManPro-android.apk

  publish-release:
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: catman-windows
          path: release

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: catman-android
          path: release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/CatManPro-portable.exe
            release/CatManPro-android.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
