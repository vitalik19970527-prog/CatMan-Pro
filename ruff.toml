extend-exclude = ["asn1crypto"]

[lint]
# Keep to the rules that catch real bugs (pyflakes: undefined names, unused
# imports, syntax issues) rather than ruff's opinionated style/plugin
# categories (BLE blind-except, SIM simplify, DTZ naive-datetime, PLW
# try/except/pass, C4 comprehensions, ARG unused-arg, ...). This codebase
# deliberately uses broad `except Exception: logger.exception(...)` for
# resilience (a desktop app that must never crash the user out), nested
# `with` blocks for readability, and `# noqa: ARG002` on API-compat
# parameters -- those plugin categories fight established, intentional
# patterns rather than flagging actual defects, and were the bulk of the
# editor's Problems-panel noise.
select = ["E", "F"]
ignore = ["E401", "E402", "E501", "E701", "E702"]
